services:
  - type: web
    name: ballpark-runtime
    runtime: docker
    plan: standard
    autoDeploy: false
    dockerCommand: service
    healthCheckPath: /healthz
    disk:
      name: ballpark-runtime-data
      mountPath: /var/lib/ballpark
      sizeGB: 1
    envVars:
      - key: BALLPARK_HOST
        value: 0.0.0.0
