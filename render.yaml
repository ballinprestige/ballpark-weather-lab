services:
  - type: web
    name: ballpark-runtime
    runtime: docker
    plan: standard
    dockerCommand: server
    healthCheckPath: /healthz
    disk:
      name: ballpark-runtime-data
      mountPath: /var/lib/ballpark
      sizeGB: 1
    envVars:
      - key: BALLPARK_HOST
        value: 0.0.0.0
  - type: worker
    name: ballpark-runtime-worker
    runtime: docker
    plan: standard
    dockerCommand: worker
    disk:
      name: ballpark-runtime-worker-data
      mountPath: /var/lib/ballpark
      sizeGB: 1
