name: Linux container runtime smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build and verify artifact-complete image
        run: |
          set -euo pipefail
          docker build --tag ballpark-runtime-smoke:ci .
          docker run --rm --entrypoint ballpark ballpark-runtime-smoke:ci verify-artifacts
      - name: Prove fixture worker iteration, child failure, and graceful shutdown
        run: |
          set -euo pipefail
          mkdir -p .ci-runtime
          name=ballpark-runtime-smoke
          cleanup() { docker rm --force "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" --publish 127.0.0.1:18080:8080 \
            --env BALLPARK_HOST=0.0.0.0 --env PORT=8080 \
            --env BALLPARK_FIXTURE=/fixture.json --env BALLPARK_DATE=2026-08-26 \
            --volume "$PWD/tests/fixtures/no_slate.json:/fixture.json:ro" \
            ballpark-runtime-smoke:ci service
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/readiness >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/data/release.json >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/data/data.json | grep -F '"status":"no_slate"'
          heartbeat() {
            docker exec "$name" python -c 'import json,sqlite3; print(json.loads(sqlite3.connect("/var/lib/ballpark/state/runtime-state.sqlite3").execute("select value from state").fetchone()[0])["heartbeat_at"])'
          }
          first_heartbeat="$(heartbeat)"
          sleep 2
          second_heartbeat="$(heartbeat)"
          test "$first_heartbeat" != "$second_heartbeat"
          docker stats --no-stream --format '{{json .}}' "$name" | tee .ci-runtime/no-slate-container-stats.json
          for request in $(seq 1 40); do curl --fail --silent http://127.0.0.1:18080/data/data.json >/dev/null; done
          docker logs "$name" > .ci-runtime/no-slate-service.log 2>&1
          docker exec "$name" python -c 'import os,signal; [(os.kill(int(pid), signal.SIGTERM)) for pid in os.listdir("/proc") if pid.isdigit() and b"runtime-worker" in open(f"/proc/{pid}/cmdline", "rb").read()]'
          for attempt in $(seq 1 15); do docker inspect --format '{{.State.Running}}' "$name" | grep -qx false && break; sleep 1; done
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" != 0
          docker rm "$name"
          trap - EXIT
          name=ballpark-runtime-term
          trap cleanup EXIT
          docker run --detach --name "$name" --publish 127.0.0.1:18081:8080 \
            --env BALLPARK_HOST=0.0.0.0 --env PORT=8080 \
            --env BALLPARK_FIXTURE=/fixture.json --env BALLPARK_DATE=2026-08-26 \
            --volume "$PWD/tests/fixtures/no_slate.json:/fixture.json:ro" \
            ballpark-runtime-smoke:ci service
          docker stop --time 12 "$name"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
      - name: Upload runtime smoke receipts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: linux-container-runtime-smoke
          path: .ci-runtime
          if-no-files-found: warn
