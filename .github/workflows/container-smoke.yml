name: Linux container runtime smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build and verify artifact-complete image
        run: |
          set -euo pipefail
          docker build --tag ballpark-runtime-smoke:ci .
          docker run --rm --entrypoint ballpark ballpark-runtime-smoke:ci verify-artifacts
      - name: Run fixture service through worker, acceptor, server, and shutdown
        run: |
          set -euo pipefail
          name=ballpark-runtime-smoke
          cleanup() { docker rm --force "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" --publish 127.0.0.1:18080:8080 \
            --env BALLPARK_HOST=0.0.0.0 --env PORT=8080 \
            --env BALLPARK_FIXTURE=/fixture.json --env BALLPARK_DATE=2026-08-26 \
            --volume "$PWD/tests/fixtures/no_slate.json:/fixture.json:ro" \
            ballpark-runtime-smoke:ci service
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/readiness >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/data/release.json >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/data/data.json | grep -F '"status":"no_slate"'
          sleep 2
          docker exec "$name" ballpark runtime-probe --state-dir /var/lib/ballpark/state | grep -F '"state": "ready"'
          docker stop --time 12 "$name"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
