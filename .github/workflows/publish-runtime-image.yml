name: Publish reviewed runtime image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA already reviewed for publication
        required: true
        type: string

permissions: {}

concurrency:
  group: reviewed-runtime-image-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed linux-amd64 runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
    env:
      IMAGE: ghcr.io/ballinprestige/ballpark-weather-lab
      REVISION: ${{ inputs.revision }}
      SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:db4108427c05acbadd1447316caa9b5f097a9a737d897d2297443baedff37ded
      GH_TOKEN: ${{ github.token }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the reviewed revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate revision, ancestry, required latest checks, and Docker exclusions
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "revision must be a full 40-character hexadecimal SHA" >&2
            exit 1
          fi
          revision="$(printf '%s' "$REVISION" | tr '[:upper:]' '[:lower:]')"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${revision}^{commit}"
          if ! git merge-base --is-ancestor "$revision" origin/main; then
            echo "reviewed revision is not an ancestor of fetched origin/main" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$revision" ]]; then
            echo "checkout did not resolve to the reviewed revision" >&2
            exit 1
          fi
          printf 'REVISION=%s\n' "$revision" >> "$GITHUB_ENV"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/commits/${revision}/check-runs?filter=all&per_page=100" \
            > check-run-pages.json
          jq -s '[.[].check_runs[]]' check-run-pages.json > all-check-runs.json
          : > selected-checks.ndjson
          for required_name in "PR verification" "container-smoke"; do
            case "$required_name" in
              "PR verification") expected_workflow=".github/workflows/verify.yml"; expected_job="PR verification" ;;
              "container-smoke") expected_workflow=".github/workflows/container-smoke.yml"; expected_job="container-smoke" ;;
            esac
            jq --arg name "$required_name" --arg revision "$revision" \
              '[.[] | select(.name == $name and .head_sha == $revision and .app.slug == "github-actions")]
               | sort_by([(.started_at // .created_at // ""), (.id // 0)]) | last' \
              all-check-runs.json > selected-check.json
            jq -e --arg revision "$revision" \
              'type == "object" and .head_sha == $revision and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success"' \
              selected-check.json > /dev/null
            details_url="$(jq -r '.details_url // empty' selected-check.json)"
            if [[ ! "$details_url" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/([0-9]+)/job/([0-9]+) ]]; then
              echo "required check is not bound to a GitHub Actions run/job URL" >&2
              exit 1
            fi
            run_id="${BASH_REMATCH[1]}"; job_id="${BASH_REMATCH[2]}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > selected-workflow-run.json
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > selected-workflow-jobs.json
            jq -e --arg revision "$revision" --arg path "$expected_workflow" --argjson run_id "$run_id" \
              '.id == $run_id and .path == $path and .head_sha == $revision and .event == "pull_request" and .status == "completed" and .conclusion == "success"' \
              selected-workflow-run.json > /dev/null
            jq -e --arg name "$expected_job" --argjson job_id "$job_id" \
              '[.jobs[] | select(.id == $job_id and .name == $name and .status == "completed" and .conclusion == "success")] | length == 1' \
              selected-workflow-jobs.json > /dev/null
            jq --arg workflow_path "$expected_workflow" --arg expected_job "$expected_job" \
              --argjson run_id "$run_id" --argjson job_id "$job_id" \
              --slurpfile workflow_run selected-workflow-run.json --slurpfile jobs selected-workflow-jobs.json \
              '. + {workflow_path: $workflow_path, workflow_run_id: $run_id, workflow_run_attempt: $workflow_run[0].run_attempt, workflow_job_id: $job_id, workflow_job_name: $expected_job, check_suite_id: .check_suite.id}' \
              selected-check.json >> selected-checks.ndjson
            printf '\n' >> selected-checks.ndjson
          done
          jq -s '.' selected-checks.ndjson > selected-checks.json
          mkdir -p publication-diagnostics
          cp selected-checks.json publication-diagnostics/

          for required_pattern in '.runtime*' '.ballpark-cache' '.tmp*' '.env' '.env.*' '*.log'; do
            grep -Fqx -- "$required_pattern" .dockerignore
          done

      - name: Log in to GitHub Container Registry through standard input
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build the reviewed public source image locally
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --tag "${IMAGE}:${REVISION}" \
            .
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE}:${REVISION}")" == "linux/amd64" ]]
          docker image inspect --format '{{.Id}}' "${IMAGE}:${REVISION}" > local-image-inspect-id.txt
          docker image save "${IMAGE}:${REVISION}" --output local-image.tar
          local_config_path="$(tar -xOf local-image.tar manifest.json | jq -r '.[0].Config')"
          local_platform_config_digest="sha256:$(tar -xOf local-image.tar "$local_config_path" | sha256sum | awk '{print $1}')"
          local_image_tar_sha256="$(sha256sum local-image.tar | awk '{print $1}')"
          printf 'LOCAL_PLATFORM_CONFIG_DIGEST=%s\n' "$local_platform_config_digest" >> "$GITHUB_ENV"
          printf 'LOCAL_IMAGE_TAR_SHA256=%s\n' "$local_image_tar_sha256" >> "$GITHUB_ENV"

      - name: Verify artifacts in the locally built image before push
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint ballpark "${IMAGE}:${REVISION}" verify-artifacts

      - name: Record the pinned Skopeo runtime identity before publication
        shell: bash
        run: |
          set -euo pipefail
          skopeo_version="$(docker run --rm --network none "$SKOPEO_IMAGE" --version)"
          if [[ -z "$skopeo_version" || "$skopeo_version" != skopeo\ version\ * ]]; then
            echo "pinned Skopeo image did not report its version" >&2
            exit 1
          fi
          mkdir -p publication-diagnostics
          jq -n --arg image "$SKOPEO_IMAGE" --arg version "$skopeo_version" \
            '{skopeo_image:$image, skopeo_version:$version}' \
            > publication-diagnostics/skopeo-runtime-identity.json
          printf '%s\n' "$skopeo_version" > skopeo-version.txt

      - name: Convert the verified Docker archive to a local OCI layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reviewed-oci
          docker run --rm --network none -v "$PWD:/work" -w /work "$SKOPEO_IMAGE" \
            copy docker-archive:/work/local-image.tar oci:/work/reviewed-oci:reviewed
          python scripts/verify_digest_image.py --docker-archive local-image.tar \
            --oci-layout reviewed-oci --oci-ref-name reviewed --expected-reference "${IMAGE}:${REVISION}" --receipt local-oci-receipt.json
          oci_manifest_digest="$(jq -er '.oci_manifest_digest' local-oci-receipt.json)"
          [[ "$oci_manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'OCI_MANIFEST_DIGEST=%s\n' "$oci_manifest_digest" >> "$GITHUB_ENV"

      - name: Publish only the verified OCI manifest by digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-diagnostics
          printf '{"push_attempted":true,"image":"%s","digest":"%s"}\n' "$IMAGE" "$OCI_MANIFEST_DIGEST" > publication-diagnostics/push-attempt.json
          docker run --rm -v "$PWD:/work" -v "$HOME/.docker:/root/.docker:ro" -w /work "$SKOPEO_IMAGE" \
            copy --preserve-digests --format oci --digestfile /work/pushed-digest.txt \
            oci:/work/reviewed-oci:reviewed "docker://${IMAGE}@${OCI_MANIFEST_DIGEST}"
          [[ "$(cat pushed-digest.txt)" == "$OCI_MANIFEST_DIGEST" ]]
          docker run --rm -v "$PWD:/work" -v "$HOME/.docker:/root/.docker:ro" -w /work "$SKOPEO_IMAGE" \
            inspect --raw "docker://${IMAGE}@${OCI_MANIFEST_DIGEST}" > remote-manifest.json
          python scripts/verify_digest_image.py --docker-archive local-image.tar \
            --oci-layout reviewed-oci --oci-ref-name reviewed --expected-reference "${IMAGE}:${REVISION}" --remote-manifest remote-manifest.json \
            --receipt remote-oci-receipt.json
          oci_config_digest="$(jq -er '.oci_config_digest' local-oci-receipt.json)"
          oci_config_hex="${oci_config_digest#sha256:}"
          rm -rf remote-oci
          docker run --rm -v "$PWD:/work" -v "$HOME/.docker:/root/.docker:ro" -w /work "$SKOPEO_IMAGE" \
            copy --preserve-digests "docker://${IMAGE}@${OCI_MANIFEST_DIGEST}" oci:/work/remote-oci:reviewed
          [[ "$(sha256sum "remote-oci/blobs/sha256/${oci_config_hex}" | awk '{print $1}')" == "$oci_config_hex" ]]
          cmp -- "reviewed-oci/blobs/sha256/${oci_config_hex}" "remote-oci/blobs/sha256/${oci_config_hex}"
          docker pull "${IMAGE}@${OCI_MANIFEST_DIGEST}" > docker-pull-by-digest.txt
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE}@${OCI_MANIFEST_DIGEST}")" == "linux/amd64" ]]
          docker run --rm --entrypoint ballpark "${IMAGE}@${OCI_MANIFEST_DIGEST}" verify-artifacts
          printf 'REGISTRY_MANIFEST_DIGEST=%s\n' "$OCI_MANIFEST_DIGEST" >> "$GITHUB_ENV"

      - name: Optionally record a sanitized registry tag observation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm -v "$HOME/.docker:/root/.docker:ro" "$SKOPEO_IMAGE" \
            list-tags "docker://${IMAGE}" | python scripts/sanitize_registry_tags.py \
              --reviewed-revision "$REVISION" > publication-diagnostics/registry-tag-observation.json
          observation_status="$?"
          set -e
          if [[ "$observation_status" -ne 0 ]]; then
            printf '{"state":"unavailable"}\n' > publication-diagnostics/registry-tag-observation.json
          fi

      - name: Preserve publication diagnostics after any push outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-diagnostics
          for file in local-oci-receipt.json remote-oci-receipt.json remote-manifest.json pushed-digest.txt docker-pull-by-digest.txt local-image-inspect-id.txt selected-checks.json skopeo-version.txt; do
            [[ -f "$file" ]] && cp "$file" publication-diagnostics/ || true
          done

      - name: Write digest receipt
        shell: bash
        run: |
          set -euo pipefail
          local_image_inspect_id="$(jq -Rsc 'rtrimstr("\n")' < local-image-inspect-id.txt)"
          skopeo_version="$(jq -Rsc 'rtrimstr("\n")' < skopeo-version.txt)"
          jq -n --arg image "$IMAGE" --arg revision "$REVISION" --arg digest "$REGISTRY_MANIFEST_DIGEST" \
            --arg tar_sha256 "$LOCAL_IMAGE_TAR_SHA256" --arg skopeo_image "$SKOPEO_IMAGE" \
            --argjson local_image_inspect_id "$local_image_inspect_id" --argjson skopeo_version "$skopeo_version" \
            --slurpfile local local-oci-receipt.json --slurpfile remote remote-oci-receipt.json --slurpfile checks selected-checks.json \
            '{image:$image, revision:$revision, immutable_image:($image+"@"+$digest), registry_manifest_digest:$digest, local_image_tar_sha256:$tar_sha256, local_image_inspect_id:$local_image_inspect_id, skopeo_image:$skopeo_image, skopeo_version:$skopeo_version, local_oci:$local[0], remote_oci:$remote[0], required_checks:$checks[0]}' > image-receipt.json

      - name: Upload publication receipt and reproducible source image
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: reviewed-runtime-image-receipt-${{ inputs.revision }}
          if-no-files-found: error
          retention-days: 30
          path: |
            publication-diagnostics
            image-receipt.json
            selected-checks.json
            local-image-inspect-id.txt
            local-image.tar
