name: Build, verify, and publish Ballpark

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional slate date (YYYY-MM-DD); defaults to the current New York date"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      PYTHONPATH: src
    outputs:
      slate_date: ${{ steps.receipt.outputs.slate_date }}
      payload_sha: ${{ steps.receipt.outputs.payload_sha }}
    steps:
      - name: Check out the clean publication repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked runtime and frontend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          npm ci --prefix web

      - name: Verify code, contracts, and artifact inventory
        run: |
          python -m ruff check src tests scripts
          python -m pytest
          python -m ballpark verify-artifacts
          npm run check --prefix web
          npm run test --prefix web

      - name: Install the bounded browser-test runtime
        run: npx --prefix web playwright install --with-deps chromium

      - name: Verify desktop and mobile employer paths
        run: npm run test:e2e --prefix web

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Restore already-published Ballpark history when available
        run: >-
          python -m ballpark restore-history
          --url "${{ steps.pages.outputs.base_url }}"
          --output web/public
          --maximum-dates 120

      - name: Run the one-command daily build
        shell: bash
        env:
          SLATE_DATE: ${{ inputs.date }}
        run: |
          if [[ -n "$SLATE_DATE" ]]; then
            python -m ballpark daily --date "$SLATE_DATE" --output web/public
          else
            python -m ballpark daily --output web/public
          fi

      - name: Export the immutable release receipt
        id: receipt
        shell: bash
        run: python -c "import json; d=json.load(open('web/dist/data/release.json')); print('slate_date='+d['date']); print('payload_sha='+d['payload_sha256'])" >> "$GITHUB_OUTPUT"

      - name: Upload the complete Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the single verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Check out the public verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python for public readback
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify public date and exact payload hash
        env:
          PYTHONPATH: src
        run: >-
          python -m ballpark verify-public
          --url "${{ steps.deployment.outputs.page_url }}"
          --expected-date "${{ needs.build.outputs.slate_date }}"
          --expected-sha "${{ needs.build.outputs.payload_sha }}"
          --attempts 18
          --delay 10
