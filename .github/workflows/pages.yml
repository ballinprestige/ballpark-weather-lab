name: Build, verify, and publish Ballpark

on:
  push:
    branches: [main]
  schedule:
    # Morning baseline publication (11:17 EDT / 10:17 EST).
    - cron: "17 15 * * *"
    # Additional midday recovery opportunity if the first event is delayed or dropped.
    - cron: "43 19 * * *"
    # Late refresh to pick up official lineups and Approach C where MLB has published them.
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional slate date (YYYY-MM-DD); defaults to the current New York date"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      PYTHONPATH: src
    outputs:
      slate_date: ${{ steps.receipt.outputs.slate_date }}
      payload_sha: ${{ steps.receipt.outputs.payload_sha }}
    steps:
      - name: Record trigger delivery
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          {
            echo "### Ballpark trigger delivery"
            echo "- Event: \`$TRIGGER_EVENT\`"
            if [[ -n "$SCHEDULE_EXPRESSION" ]]; then
              echo "- Schedule expression: \`$SCHEDULE_EXPRESSION\`"
            fi
            echo "- Runner accepted trigger at: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the clean publication repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked runtime and frontend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          npm ci --prefix web

      - name: Verify code, contracts, and artifact inventory
        run: |
          python -m ruff check src tests scripts
          python -m pytest
          python -m ballpark verify-artifacts
          npm run check --prefix web
          npm run test --prefix web

      - name: Install the bounded browser-test runtime
        run: npx --prefix web playwright install --with-deps chromium

      - name: Verify desktop and mobile employer paths
        run: npm run test:e2e --prefix web

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Restore already-published Ballpark history when available
        run: >-
          python -m ballpark restore-history
          --url "${{ steps.pages.outputs.base_url }}"
          --output web/public
          --maximum-dates 120

      - name: Run the one-command daily build
        shell: bash
        env:
          SLATE_DATE: ${{ inputs.date }}
        run: |
          if [[ -n "$SLATE_DATE" ]]; then
            python -m ballpark daily --date "$SLATE_DATE" --output web/public
          else
            python -m ballpark daily --output web/public
          fi

      - name: Export the immutable release receipt
        id: receipt
        shell: bash
        run: python -c "import json; d=json.load(open('web/dist/data/release.json')); print('slate_date='+d['date']); print('payload_sha='+d['payload_sha256'])" >> "$GITHUB_OUTPUT"

      - name: Upload the complete Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the single verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Check out the public verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python for public readback
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked contract-verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Verify public date and exact payload hash
        env:
          PYTHONPATH: src
        run: >-
          python -m ballpark verify-public
          --url "${{ steps.deployment.outputs.page_url }}"
          --expected-date "${{ needs.build.outputs.slate_date }}"
          --expected-sha "${{ needs.build.outputs.payload_sha }}"
          --attempts 18
          --delay 10

      - name: Report the seven-day archive-generation gate
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m ballpark verify-reliability \
            --url "${{ steps.deployment.outputs.page_url }}" \
            --ending-date "${{ needs.build.outputs.slate_date }}" | tee reliability.json
          {
            echo "### Seven-day publication evidence"
            echo '```json'
            cat reliability.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
