name: PR verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# The workflow executes proposed PR code. Keep the token unable to modify repository,
# deployment, package, or identity state. Individual jobs repeat this restriction so a
# later root-permission change cannot silently widen this job.
permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-verify:
    name: PR verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - name: Record untrusted pull-request receipt
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_REF: ${{ github.event.pull_request.head.ref }}
          PULL_REQUEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "### PR verification receipt"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Pull request: \`#$PULL_REQUEST_NUMBER\`"
            echo "- Proposed ref: \`$PULL_REQUEST_REF\`"
            echo "- Proposed SHA: \`$PULL_REQUEST_SHA\`"
            echo "- Runner started (UTC): \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the exact proposed revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Record runtime and lock identities
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          if [[ ! "$node_version" =~ ^v22\.(1[2-9]|[2-9][0-9])\. ]]; then
            echo "Unsupported Node runtime: $node_version (need >=22.12, <23)" >&2
            exit 1
          fi
          {
            echo "### Runtime and lock receipt"
            echo "- Python: \`$(python --version)\`"
            echo "- Node: \`$node_version\`"
            echo "- requirements.lock SHA-256: \`$(sha256sum requirements.lock | awk '{print $1}')\`"
            echo "- web/package-lock.json SHA-256: \`$(sha256sum web/package-lock.json | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          npm ci --prefix web

      - name: Verify Python quality, regressions, contracts, and artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src tests scripts
          python -m pytest
          python -m ballpark verify-artifacts

      - name: Verify frontend types, units, build, and budget
        shell: bash
        run: |
          set -euo pipefail
          npm run verify --prefix web

      - name: Install bounded browser-test runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --prefix web playwright install --with-deps chromium

      - name: Verify desktop and mobile browser paths
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e --prefix web
